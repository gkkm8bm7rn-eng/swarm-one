name: Integrate Vision v0.8.0

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Vision patch
        run: python3 scripts/patch_vision_v080.py
      - name: Validate
        run: |
          node --check app.js
          node --check vision-worker.js
          grep -q 'APP_VERSION = "0.8.0"' app.js
          grep -q 'buildVisionEvidence' app.js
          grep -q 'vision-worker.js?v=0.8.0' service-worker.js
      - name: Commit
        run: |
          rm -f .github/workflows/integrate-vision-v080.yml scripts/patch_vision_v080.py
          git config user.name "SWARM One automation"
          git config user.email "actions@users.noreply.github.com"
          git add app.js index.html service-worker.js vision-worker.js .github/workflows/integrate-vision-v080.yml scripts/patch_vision_v080.py
          git commit -m "Integrate lightweight Vision sensor v0.8.0"
          git push
