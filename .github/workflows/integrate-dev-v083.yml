name: Integrate DEV diagnostics v0.8.3

on:
  push:
    paths:
      - .github/workflows/integrate-dev-v083.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          app = Path('app.js')
          s = app.read_text()
          s = s.replace('const APP_VERSION = "0.8.2";', 'const APP_VERSION = "0.8.3";')
          s = s.replace('debugDisconnectButton: $("debugDisconnectButton"), debugNote: $("debugNote"), composerFoot: $("composerFoot"), devBadge: $("devBadge"),', 'debugDisconnectButton: $("debugDisconnectButton"), debugShareButton: $("debugShareButton"), debugNote: $("debugNote"), composerFoot: $("composerFoot"), devBadge: $("devBadge"),')

          anchor = 'function clearDebugTopic() {\n  void debugEvent("debug_bridge_disconnected", { source: "settings" });\n  debugTopic = "";'
          if anchor not in s:
              raise SystemExit('clearDebugTopic anchor not found')

          share_fn = '''async function shareDebugReport() {
  const report = {
    format: "SWARM_DEV_DIAGNOSTICS",
    version: APP_VERSION,
    exportedAt: nowIso(),
    session: debugSession,
    eventCount: debugBuffer.length,
    events: debugBuffer,
  };
  const text = JSON.stringify(report, null, 2);
  const file = new File([text], `SWARM_DEV_${APP_VERSION}_${new Date().toISOString().replace(/[:.]/g, "-")}.json`, { type: "application/json" });
  try {
    if (navigator.share && navigator.canShare?.({ files: [file] })) {
      await navigator.share({ title: "SWARM DEV diagnostics", text: `SWARM ${APP_VERSION} · ${debugBuffer.length} событий`, files: [file] });
      toast("Диагностика подготовлена для отправки");
      return;
    }
    await navigator.clipboard.writeText(text);
    toast("Диагностика скопирована — вставь её в чат");
  } catch (err) {
    if (err?.name === "AbortError") return;
    try {
      await navigator.clipboard.writeText(text);
      toast("Диагностика скопирована — вставь её в чат");
    } catch {
      toast(`Не удалось поделиться диагностикой: ${err?.message || err}`, 5000);
    }
  }
}

'''
          s = s.replace(anchor, share_fn + anchor)

          bind_anchor = '  els.debugDisconnectButton?.addEventListener("click", () => clearDebugTopic());'
          if bind_anchor not in s:
              raise SystemExit('debug disconnect bind anchor not found')
          s = s.replace(bind_anchor, bind_anchor + '\n  els.debugShareButton?.addEventListener("click", () => shareDebugReport());')
          s = s.replace('new Worker("./vision-worker.js?v=0.8.2"', 'new Worker("./vision-worker.js?v=0.8.3"')
          app.write_text(s)

          idx = Path('index.html')
          h = idx.read_text()
          h = h.replace('SWARM One · v0.8.2', 'SWARM One · v0.8.3')
          h = h.replace('./app.js?v=0.8.2', './app.js?v=0.8.3')
          button_anchor = '<button id="debugDisconnectButton" class="ghost-button" type="button">Отключить</button>'
          if button_anchor not in h:
              raise SystemExit('debug button anchor not found')
          h = h.replace(button_anchor, button_anchor + '\n              <button id="debugShareButton" class="ghost-button" type="button">Поделиться журналом</button>')
          h = h.replace('Технические события сохраняются локально.', 'Технические события сохраняются локально; журнал можно отправить одним нажатием.')
          idx.write_text(h)

          sw = Path('service-worker.js')
          w = sw.read_text()
          w = w.replace('swarm-one-v0.8.2', 'swarm-one-v0.8.3')
          w = w.replace('./app.js?v=0.8.2', './app.js?v=0.8.3')
          w = w.replace('./vision-worker.js?v=0.8.2', './vision-worker.js?v=0.8.3')
          sw.write_text(w)
          PY

      - name: Validate
        shell: bash
        run: |
          node --check app.js
          node --check vision-worker.js
          grep -q '0.8.3' app.js
          grep -q 'debugShareButton' app.js
          grep -q 'debugShareButton' index.html
          grep -q 'swarm-one-v0.8.3' service-worker.js

      - name: Commit and self-clean
        shell: bash
        run: |
          git config user.name "SWARM One automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/integrate-dev-v083.yml
          git add app.js index.html service-worker.js
          git commit -m "Add one-tap DEV diagnostics sharing v0.8.3"
          git push
