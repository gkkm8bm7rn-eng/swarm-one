name: Integrate Vision v0.8.1

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - name: Apply Vision v0.8.1 patch
        run: python3 scripts/patch_vision_v081.py
      - name: Validate
        run: |
          node --check app.js
          node --check vision-worker.js
          grep -q 'APP_VERSION = "0.8.1"' app.js
          grep -q 'VISION_LOAD_FAILED' app.js
          grep -q 'Vision-предпросмотр' app.js
          grep -q 'swarm-one-v0.8.1' service-worker.js
          grep -q 'app.js?v=0.8.1' index.html
      - name: Commit
        run: |
          rm -f .github/workflows/integrate-vision-v081.yml
          git config user.name "SWARM One automation"
          git config user.email "actions@users.noreply.github.com"
          git add app.js index.html service-worker.js scripts/patch_vision_v081.py .github/workflows/integrate-vision-v081.yml
          git commit -m "Decouple Vision from text model v0.8.1"
          git push
